[project]
name = "algorithms-and-structures"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3"
]

[project.scripts]
dsa = "dsa.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["problems", "tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = ["src/dsa"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]
